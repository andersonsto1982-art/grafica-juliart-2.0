<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador | Gráfica Juliart</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container { max-width: 800px; margin: 40px auto; padding: 25px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }
        .checkbox-group input { width: auto; cursor: pointer; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th, .admin-table td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        .btn-delete { background: #dc3545; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-delete:hover { background: #c82333; }
        .admin-actions { display: flex; gap: 8px; align-items: center; }
        .btn-logout { background: #6c757d; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-logout:hover { background: #5a6268; }
        .header-admin { display: flex; justify-content: space-between; align-items: center; }
        .section-divider { border: 0; height: 1px; background: #eee; margin: 30px 0; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-container header-admin" style="width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px;">
            <h1 class="logo-text">Painel <span>Administrativo</span></h1>
            <button id="btn-logout" class="btn-logout" onclick="fazerLogout()" style="display: none;">
                <i class="fa-solid fa-right-from-bracket"></i> Sair
            </button>
        </div>
    </header>

    <main class="container">
        <!-- FORMULÁRIO DE LOGIN -->
        <div id="login-section" class="admin-container">
            <h2><i class="fa-solid fa-lock"></i> Acesso Restrito</h2>
            <form id="form-login">
                <div class="form-group">
                    <label for="usuario">Utilizador / E-mail:</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Digite seu utilizador ou e-mail" required />
                </div>
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required />
                </div>
                <button type="submit" id="btn-entrar" class="btn-pink" style="width: 100%; padding: 10px; cursor: pointer;">Entrar</button>
            </form>
        </div>

        <!-- PAINEL DE CONTROLO / DASHBOARD -->
        <div id="dashboard-section" class="admin-container" style="display: none;">
            
            <!-- FORMULÁRIO PARA CADASTRAR PRODUTO -->
            <h2><i class="fa-solid fa-plus-circle"></i> Cadastrar Novo Produto</h2>
            <form id="form-cadastrar-produto" style="margin-bottom: 25px;">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome-produto">Nome do Produto *</label>
                        <input type="text" id="nome-produto" placeholder="Ex: Cartão de Visita" required />
                    </div>
                    <div class="form-group">
                        <label for="preco-produto">Preço (R$) *</label>
                        <input type="number" id="preco-produto" step="0.01" placeholder="Ex: 49.90" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="imagem-produto">Caminho / URL da Imagem</label>
                    <input type="text" id="imagem-produto" placeholder="Ex: /images/cartao.jpg ou https://..." />
                </div>

                <div class="form-group">
                    <label for="descricao-produto">Descrição</label>
                    <textarea id="descricao-produto" rows="3" placeholder="Detalhes sobre o produto..."></textarea>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="destaque-produto" />
                    <label for="destaque-produto">Destacar na página inicial?</label>
                </div>

                <button type="submit" id="btn-salvar-produto" class="btn-pink" style="padding: 10px 20px; cursor: pointer;">
                    <i class="fa-solid fa-floppy-disk"></i> Cadastrar Produto
                </button>
            </form>

            <hr class="section-divider">

            <!-- LISTAGEM DE PRODUTOS CADASTRADOS -->
            <h2><i class="fa-solid fa-list"></i> Produtos Cadastrados</h2>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-admin-produtos">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
